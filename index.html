<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPIC IH Daily</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e8e8e4;
    background: #fff;
  }

  .logo { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: #1a1a1a;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .date-nav {
    padding: 20px 32px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .date-nav button {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 14px;
    color: #555;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .date-nav button:hover { background: #f0f0f0; }

  .date-label {
    font-size: 13px;
    color: #888;
  }

  .today-btn {
    font-size: 12px;
    color: #555;
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
    height: 28px;
  }
  .today-btn:hover { background: #f0f0f0; }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .topic-header {
    margin-bottom: 32px;
  }

  .topic-number {
    font-size: 12px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .topic-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .topic-title-en {
    font-size: 15px;
    color: #888;
    font-weight: 400;
  }

  .section {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid #ebebeb;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #aaa;
    margin-bottom: 16px;
  }

  .questions-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .question-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .q-num {
    font-size: 11px;
    font-weight: 600;
    color: #bbb;
    margin-top: 2px;
    min-width: 18px;
  }

  .q-text {
    font-size: 15px;
    line-height: 1.6;
    color: #222;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .vocab-item {
    background: #f7f7f5;
    border-radius: 8px;
    padding: 10px 14px;
  }

  .vocab-en {
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 2px;
  }

  .vocab-ko {
    font-size: 12px;
    color: #888;
  }

  .tip-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .tip-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 14px;
    line-height: 1.6;
    color: #444;
  }

  .tip-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ccc;
    margin-top: 8px;
    flex-shrink: 0;
  }

  .structure-box {
    background: #f7f7f5;
    border-radius: 8px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.8;
    color: #444;
  }

  .structure-box strong {
    color: #1a1a1a;
  }

  .progress-bar-wrap {
    margin-top: 24px;
    background: #ebebeb;
    border-radius: 4px;
    height: 4px;
  }

  .progress-bar {
    height: 4px;
    border-radius: 4px;
    background: #1a1a1a;
    transition: width 0.4s ease;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
  }

  .done-btn {
    width: 100%;
    padding: 16px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .done-btn:hover { opacity: 0.85; }
  .done-btn.completed {
    background: #4caf50;
  }

  .streak-info {
    text-align: center;
    font-size: 13px;
    color: #aaa;
    margin-top: 12px;
  }

  .streak-info span {
    color: #1a1a1a;
    font-weight: 600;
  }

  /* calendar strip */
  .cal-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 8px;
    scrollbar-width: none;
  }
  .cal-strip::-webkit-scrollbar { display: none; }

  .cal-day {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .cal-day:hover { background: #f0f0f0; }
  .cal-day.active { background: #1a1a1a; }
  .cal-day.active .cal-wd, .cal-day.active .cal-d { color: #fff; }
  .cal-day.done-day .cal-dot { background: #4caf50; }
  .cal-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: transparent;
  }
  .cal-wd { font-size: 10px; color: #aaa; text-transform: uppercase; }
  .cal-d { font-size: 13px; font-weight: 600; color: #333; }

  /* sample answer */
  .sample-toggle {
    width: 100%;
    padding: 11px 16px;
    background: #f7f7f5;
    color: #555;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .sample-toggle:hover { background: #efefef; }

  .sample-body {
    margin-top: 14px;
    font-size: 15px;
    line-height: 1.85;
    color: #333;
    background: #f7f7f5;
    border-radius: 8px;
    padding: 16px 18px;
    border-left: 3px solid #1a1a1a;
  }

  /* typing practice */
  .q-wrap { display: flex; flex-direction: column; flex: 1; }

  .answer-input {
    margin-top: 10px;
    width: 100%;
    min-height: 96px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.7;
    color: #222;
    background: #fafaf8;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    box-sizing: border-box;
  }
  .answer-input:focus { border-color: #1a1a1a; background: #fff; }
  .answer-input::placeholder { color: #bbb; }

  .word-count {
    margin-top: 5px;
    font-size: 11px;
    color: #bbb;
    text-align: right;
  }
  .word-count.has-text { color: #888; }
</style>
</head>

  `I majored in computer science at a university in Seoul and graduated about four years ago. My favorite subject was algorithms — not because it was easy, but because it taught me a very systematic way of thinking. The professor who influenced me the most was incredibly passionate about his field. He didn't just teach the curriculum; he constantly challenged us to think about real-world applications.\n\nThat mindset has really shaped how I approach problems at work. As for the Korean education system, I think it's rigorous and effective in many ways, but sometimes too focused on exam scores rather than fostering critical thinking and creativity.`,

  // 14. 가족/인간관계
  `I'm from a fairly close-knit family. I have one older sister, and we get along really well — probably because we have similar tastes in movies and food. My parents live in Busan, so I don't see them as often as I'd like, but we video call every Sunday.\n\nMy closest friend is someone I've known since middle school. What makes that friendship so special is that we can be completely honest with each other — no judgment at all. Even when we go through periods without talking much, we pick up right where we left off. I think that kind of unconditional trust is genuinely rare.`,

  // 15. 취미 활동
  `My main hobby is street photography. I got into it about three years ago when I bought a second-hand camera on a whim. I dedicate maybe four or five hours a week to it, mostly on weekends when I walk around different neighborhoods looking for interesting moments to capture.\n\nWhat I love about it is that it forces me to really observe the world around me. It's taught me patience and an eye for detail, which has honestly been useful at work too. I used to play video games a lot in my early twenties, but I've gradually lost interest in that. Photography feels more hands-on and rewarding to me now.`,

  // 16. 여가 시간
  `During the week, my free time is pretty limited, so I mostly unwind by watching a show or reading a bit before bed. On weekends, though, I try to be more intentional — I might go hiking, meet friends for brunch, or just explore a new neighborhood with my camera.\n\nRecently, I had a really memorable weekend where a group of us did a spontaneous two-day trip to Jirisan. A friend texted on Friday night and we just went. That kind of unplanned quality time is honestly some of the best. I think as I've gotten older, I've started to appreciate just being present rather than having every minute scheduled.`,

  // 17. 독서/책
  `I read regularly, though maybe not as much as I'd like. I tend to prefer non-fiction — books on psychology, productivity, and technology. But occasionally I'll pick up a novel if it's highly recommended.\n\nThe book that changed my perspective the most was 'Thinking, Fast and Slow' by Daniel Kahneman. It completely reshaped how I think about decision-making — both at work and in everyday life. I had never thought so consciously about cognitive biases before. As for format, I use an e-reader for most things because it's convenient, but for books I really care about, I prefer physical copies — there's something about holding the actual pages that makes the reading experience feel more immersive.`,

  // 18. 반려동물
  `I don't currently have any pets, mainly because my apartment building doesn't allow them. But I grew up with a golden retriever named Mori, and that dog was absolutely part of the family. He was incredibly affectionate — always excited to see you no matter what kind of day you'd had.\n\nHaving him taught me a lot about unconditional care and responsibility. The biggest challenges were the cost of vet visits and the time commitment, but my parents still talk about him fondly even years after he passed. I definitely plan to get a dog again once I move somewhere that allows pets — I already know exactly what breed I'd want.`,

  // 19. 공원/야외 활동
  `There's a park along the Han River near my apartment that I visit fairly regularly, especially on weekends. It's a large urban park with cycling paths, open lawns, and a great view of the river. I usually go for a run or just take a walk to clear my head. In summer, I sometimes meet friends there for a picnic.\n\nThe most memorable outdoor experience I've had was hiking Seoraksan in October — the foliage was breathtaking and the trail was challenging enough to feel like a real achievement. The park near my home has changed a lot over the years — there are more leisure facilities now and it's become much more popular with families on weekends.`,

  // 20. 콘서트/공연
  `I've been to a few concerts, but the most memorable was seeing a jazz trio at a small venue in Itaewon. It was completely different from what I expected — very intimate, and the musicians talked with the audience between songs. The atmosphere was electric in the best possible way.\n\nWhat makes a live performance so special is the unpredictability — you feel the energy of the crowd and the performers feeding off each other in real time. Watching the same thing on YouTube just doesn't capture that at all. If I could see anyone live right now, it would be Jacob Collier — his stage presence is legendary, and I imagine seeing him perform live would be absolutely mesmerizing.`,

  // 21. 음식점/카페
  `There's a small Korean barbecue place near my office that I keep going back to. What I love about it is the ambiance — it's warm, a little rustic, and the service is genuinely attentive without being intrusive. Their signature dish is samgyeopsal with a special house marinade that I've never tasted anywhere else.\n\nWhen I'm choosing where to eat, I usually check reviews online first, then factor in the atmosphere and whether it's worth the wait. I did have a bad experience once at a newer restaurant where they completely got my order wrong and weren't very apologetic about it. I didn't go back after that.`,

  // 22. 은행/금융
  `I manage most of my finances through a mobile banking app. I check my balance regularly and set a rough monthly budget at the start of each month. One experience that really frustrated me was when my card was suddenly blocked while I was traveling — it turned out to be a fraud alert, but it took a while to resolve remotely. Since then, I always notify my bank before any trips.\n\nMobile banking has made things so much more convenient — I can do everything from my phone now. My main financial goal is to build up an emergency fund of about six months' worth of expenses. As for credit cards versus cash, I prefer cards for the convenience and the rewards points.`,

  // 23. 약국/의료
  `South Korea has a very solid healthcare system. Most medical costs are covered by national health insurance, so visits to the doctor are quite affordable. I had to visit the emergency room once a few years ago — I had a fever that wasn't getting better. The whole process from registration to treatment was surprisingly efficient, which I really appreciated.\n\nFor minor things like a cold or headache, I usually just go to a local pharmacy and pick up some over-the-counter medication. I try not to rely too much on pills and prefer to rest and stay hydrated instead. Regular checkups are something I've started prioritizing more seriously since I turned thirty.`,

  // 24. 대중교통
  `I use the subway every day for my commute — about 40 minutes each way. Seoul's public transportation system is genuinely excellent. It's clean, punctual, and very well-connected throughout the city. Compared to driving, it's much less stressful, especially during rush hour when the roads are incredibly congested and parking is expensive.\n\nThe most interesting experience I've had on public transport was accidentally getting on the wrong line late at night and ending up at a station I didn't recognize. I eventually found my way back, but it was a bit of an adventure. In recent years, the city has added more eco-friendly options like electric buses and bike-sharing stations.`,

  // 25. 패션/옷차림
  `My personal style is pretty casual — I prioritize comfort over trends. On weekdays, I usually go with clean basics: a good pair of jeans and a plain t-shirt or a light jacket. I care about looking put-together, but I wouldn't say I'm particularly fashion-conscious.\n\nMy style has changed a lot over the years — in college, I was much more experimental and tried lots of trendy looks. Now I prefer timeless pieces that I can wear across multiple seasons. When it comes to fast fashion, I have mixed feelings. It's convenient and affordable, but the environmental impact is real. I've been trying to shop more sustainably — buying fewer but better-quality items.`,

  // 26. 여행지 묘사
  `The place that's left the strongest impression on me is probably Lisbon, Portugal. I visited two summers ago and immediately fell in love with the city. It has this incredible combination of old architecture, colorful street art, and a warm, laid-back atmosphere that's hard to describe.\n\nThe local cuisine was outstanding — especially the pasteis de nata. What made Lisbon different from Seoul is the pace of life — nobody seemed to be in a rush. The hospitality was genuinely warm everywhere I went. I'd strongly recommend it to anyone who enjoys history and beautiful views. Would I want to live there? Honestly, yes — if it weren't for work, I'd seriously consider it.`,

  // 27. 집에서 보내는 시간
  `When I'm at home, I follow a fairly consistent routine. In the evenings, I cook dinner, handle any remaining work, and then wind down with a book or a show. On weekends, I might do some home improvement projects or just declutter — I find tidying up oddly satisfying.\n\nI'm definitely a bit of a homebody. I love the cozy atmosphere of my apartment, especially when the weather outside is bad. That said, I think it's easy to spend too much time at home and gradually lose touch with the world. Since the pandemic, a lot of people — including me — started spending much more time indoors, and while some habits stuck, I've been making a conscious effort to get out more recently.`,

  // 28. 집 구하기
  `Finding my current apartment was quite a process. I knew I wanted to be close to a subway line and within a reasonable commute to work — those were non-negotiable. I worked with a real estate agent and looked at about six or seven places before deciding.\n\nThe deposit system in Korea is quite unique — with jeonse, you essentially lend a large lump sum to the landlord and live rent-free, which is very different from how renting works in other countries. The housing market in Seoul is competitive and expensive, especially near the city center. As for whether I'd prefer renting or owning — right now I prefer the flexibility of renting, but long-term, I'd love to own a place.`,

  // 29. 이웃/동네
  `My neighborhood is in a residential area of western Seoul. It's not the most glamorous part of the city, but it's very livable. There are plenty of cafes, a supermarket within walking distance, and I'm right next to a subway station, so the proximity to transport is excellent.\n\nIt's a fairly quiet area — mostly families and young professionals. I don't know my neighbors personally, but from what I can tell, people tend to keep to themselves here, which I actually don't mind. In terms of changes, I've noticed more specialty cafes and boutiques popping up over the past couple of years, which suggests the area is slowly gentrifying. It's nice in some ways, but I do worry about rising rents.`,

  // 30. 롤플레이: 약속 잡기
  `Hey! I was thinking we should catch up this weekend — it's been a while. Are you free on Saturday or Sunday? I was thinking maybe brunch somewhere or just a walk in the park — what does your weekend look like?\n\nAlso, is there anywhere specific you've been wanting to try? I'm pretty flexible. Oh, and what time works best for you — morning or afternoon? I need to work around a family lunch on Sunday, so Saturday is probably easier for me. Let me know and I'll pencil it in. Looking forward to catching up!`,
];

const DAY_MS = 86400000;
const START_DATE = new Date('2026-01-01');

function getDayIndex(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const s = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const diff = Math.floor((d - s) / DAY_MS);
  return ((diff % TOPICS.length) + TOPICS.length) % TOPICS.length;
}

function getTodayLocal() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

function formatDate(date) {
  return date.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
}

function isCompleted(dateStr) {
  const done = JSON.parse(localStorage.getItem('opic_done') || '{}');
  return !!done[dateStr];
}

function toggleComplete(dateStr) {
  const done = JSON.parse(localStorage.getItem('opic_done') || '{}');
  done[dateStr] = !done[dateStr];
  localStorage.setItem('opic_done', JSON.stringify(done));
}

function getStreak() {
  const done = JSON.parse(localStorage.getItem('opic_done') || '{}');
  let streak = 0;
  const today = getTodayLocal();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today.getTime() - i * DAY_MS);
    const key = d.toISOString().split('T')[0];
    if (done[key]) streak++;
    else if (i > 0) break;
  }
  return streak;
}

function toDateKey(date) {
  return date.toISOString().split('T')[0];
}

let currentDate = getTodayLocal();
let revealedSample = false;

function render() {
  const todayLocal = getTodayLocal();
  const idx = getDayIndex(currentDate);
  const topic = TOPICS[idx];
  const dateKey = toDateKey(currentDate);
  const allVocab = [...topic.vocab, ...(EXTRA_VOCAB[idx] || [])];
  const allTips  = [...topic.tips,  ...(EXTRA_TIPS[idx]  || [])];
  const completed = isCompleted(dateKey);
  const streak = getStreak();
  const totalDone = Object.values(JSON.parse(localStorage.getItem('opic_done') || '{}')).filter(Boolean).length;

  // Date nav
  const nav = document.getElementById('dateNav');
  nav.innerHTML = `
    <button onclick="changeDay(-1)">&#8592;</button>
    <span class="date-label">${formatDate(currentDate)}</span>
    <button onclick="changeDay(1)">&#8594;</button>
    ${toDateKey(currentDate) !== toDateKey(todayLocal) ? '<button class="today-btn" onclick="goToday()">오늘</button>' : ''}
  `;

  // Calendar strip
  const calWrap = document.getElementById('calStrip');
  let calHtml = '<div class="cal-strip" id="calInner">';
  for (let i = -6; i <= 6; i++) {
    const d = new Date(currentDate.getTime() + i * DAY_MS);
    const dKey = toDateKey(d);
    const isActive = i === 0;
    const isDone = isCompleted(dKey);
    const wd = d.toLocaleDateString('ko-KR', { weekday: 'short' });
    calHtml += `<div class="cal-day ${isActive ? 'active' : ''} ${isDone ? 'done-day' : ''}" onclick="jumpToDate('${dKey}')">
      <span class="cal-wd">${wd}</span>
      <span class="cal-d">${d.getDate()}</span>
      <span class="cal-dot"></span>
    </div>`;
  }
  calHtml += '</div>';
  calWrap.innerHTML = calHtml;

  // Main content
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topic-header">
      <div class="topic-number">Day ${idx + 1} of ${TOPICS.length}</div>
      <div class="topic-title">${topic.title}</div>
      <div class="topic-title-en">${topic.en}</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" style="width:${((idx+1)/TOPICS.length*100).toFixed(1)}%"></div>
      </div>
      <div class="progress-label">
        <span>${idx+1} / ${TOPICS.length} 주제</span>
        <span>총 ${totalDone}일 완료</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">오늘의 질문</div>
      <ul class="questions-list">
        ${topic.questions.slice(0, 2).map((q,i) => {
          const saved = loadAnswer(dateKey, i);
          const wc = wordCount(saved);
          return `
          <li class="question-item">
            <span class="q-num">${i+1}</span>
            <div class="q-wrap">
              <span class="q-text">${q}</span>
              <textarea class="answer-input" id="ans-${i}" placeholder="여기에 영어로 답변을 작성해보세요..." oninput="saveAnswer('${dateKey}', ${i}, this.value)">${saved}</textarea>
              <div class="word-count${wc > 0 ? ' has-text' : ''}" id="wc-${i}">${wc > 0 ? wc + ' words' : ''}</div>
            </div>
          </li>`;
        }).join('')}
      </ul>
    </div>

    <div class="section">
      <div class="section-title">핵심 표현</div>
      <div class="vocab-grid">
        ${allVocab.map(v => `
          <div class="vocab-item">
            <div class="vocab-en">${v.en}</div>
            <div class="vocab-ko">${v.ko}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">답변 구조</div>
      <div class="structure-box">${topic.structure}</div>
    </div>

    <div class="section">
      <div class="section-title">IH 팁</div>
      <div class="tip-list">
        ${allTips.map(t => `
          <div class="tip-item"><span class="tip-dot"></span><span>${t}</span></div>
        `).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">예시 답변</div>
      <button class="sample-toggle" onclick="toggleSample()">
        ${revealedSample ? '▲ 예시 답변 닫기' : '▼ 예시 답변 보기 (IH 수준)'}
      </button>
      ${revealedSample ? `<div class="sample-body">${(SAMPLES[idx] || '').replace(/\n\n/g, '<br><br>').replace(/\n/g, ' ')}</div>` : ''}
    </div>

    <button class="done-btn ${completed ? 'completed' : ''}" onclick="handleDone('${dateKey}')">
      ${completed ? '✓ 오늘 학습 완료' : '오늘 학습 완료 표시'}
    </button>
    <div class="streak-info">연속 학습 <span>${streak}일</span></div>
  `;
}

function changeDay(delta) {
  currentDate = new Date(currentDate.getTime() + delta * DAY_MS);
  revealedSample = false;
  render();
}

function goToday() {
  currentDate = getTodayLocal();
  revealedSample = false;
  render();
}

function jumpToDate(dateStr) {
  const parts = dateStr.split('-');
  currentDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  revealedSample = false;
  render();
}

function toggleSample() {
  revealedSample = !revealedSample;
  render();
}

function saveAnswer(dateKey, qIdx, value) {
  localStorage.setItem(`opic_ans_${dateKey}_${qIdx}`, value);
  const wc = document.getElementById(`wc-${qIdx}`);
  if (!wc) return;
  const n = wordCount(value);
  wc.textContent = n > 0 ? n + ' words' : '';
  wc.className = 'word-count' + (n > 0 ? ' has-text' : '');
}

function loadAnswer(dateKey, qIdx) {
  return localStorage.getItem(`opic_ans_${dateKey}_${qIdx}`) || '';
}

function wordCount(text) {
  return text.trim() ? text.trim().split(/\s+/).length : 0;
}

function handleDone(dateKey) {
  toggleComplete(dateKey);
  render();
}

render();
</script>
