<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>OPIc 스크립트 암기 카드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font-family: inherit; cursor: pointer; }
  button:active { transform: scale(0.97); }

  header {
    position: sticky; top: 0; z-index: 10;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #e8e8e4;
    background: #fff;
  }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .hdr-link {
    font-size: 12px; color: #555; text-decoration: none;
    border: 1px solid #ddd; border-radius: 7px; padding: 6px 10px; background: #f7f7f5;
  }
  .hdr-btn {
    background: none; border: none; font-size: 15px; color: #1a1a1a; font-weight: 600;
    padding: 6px 8px 6px 0; display: flex; align-items: center; gap: 6px;
  }

  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; }

  /* ---------- home ---------- */
  .summary {
    background: #1a1a1a; color: #fff; border-radius: 14px; padding: 18px 18px 16px; margin-bottom: 14px;
  }
  .summary .big { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .summary .sub { font-size: 12px; color: #bbb; margin-top: 2px; }
  .summary .bar { height: 5px; background: #444; border-radius: 4px; margin-top: 14px; overflow: hidden; }
  .summary .bar > div { height: 100%; background: #4caf50; border-radius: 4px; transition: width .4s; }
  .review-btn {
    width: 100%; margin-top: 14px; padding: 13px;
    background: #fff; color: #1a1a1a; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700;
  }
  .review-btn:disabled { opacity: .5; }

  .cat-title {
    font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 1px;
    margin: 20px 4px 8px;
  }
  .topic-row {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid #ebebeb; border-radius: 12px;
    padding: 13px 14px; margin-bottom: 8px; width: 100%; text-align: left;
  }
  .topic-row .num { font-size: 11px; font-weight: 700; color: #bbb; min-width: 20px; }
  .topic-row .t { flex: 1; min-width: 0; }
  .topic-row .t-ko { font-size: 15px; font-weight: 600; }
  .topic-row .t-en { font-size: 12px; color: #999; margin-top: 1px; }
  .topic-row .t-bar { height: 3px; background: #eee; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .topic-row .t-bar > div { height: 100%; background: #1a1a1a; border-radius: 3px; }
  .topic-row.complete .t-bar > div { background: #4caf50; }
  .topic-row .cnt { font-size: 12px; color: #888; font-weight: 600; white-space: nowrap; }
  .topic-row.complete .cnt { color: #4caf50; }

  /* ---------- topic view ---------- */
  .topic-head { margin: 4px 0 14px; }
  .topic-head .title { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; }
  .topic-head .en { font-size: 13px; color: #888; margin-top: 2px; }

  .tabs { display: flex; background: #e9e9e6; border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .tabs button {
    flex: 1; padding: 9px 0; border: none; background: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #777;
  }
  .tabs button.on { background: #fff; color: #1a1a1a; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    padding: 7px 12px; border-radius: 20px; border: 1px solid #ddd; background: #fff;
    font-size: 12px; font-weight: 600; color: #555;
  }
  .chip.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .opts .spacer { flex: 1; }
  .counter { font-size: 12px; color: #888; font-weight: 600; }

  /* card */
  .card {
    background: #fff; border: 1px solid #e6e6e2; border-radius: 16px;
    min-height: 300px; padding: 22px 20px 20px;
    display: flex; flex-direction: column; position: relative;
    box-shadow: 0 6px 20px rgba(0,0,0,.05);
    user-select: none; -webkit-user-select: none;
    animation: pop .18s ease;
  }
  @keyframes pop { from { opacity: .4; transform: translateY(4px) scale(.99); } to { opacity: 1; transform: none; } }
  .card .side-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #bbb;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .card .done-mark { color: #4caf50; font-size: 11px; font-weight: 700; }
  .card .ko { font-size: 17px; line-height: 1.75; color: #222; word-break: keep-all; flex: 1; }
  .card .en { font-size: 18px; line-height: 1.75; color: #111; font-weight: 500; flex: 1; }
  .card .en-sub { font-size: 13px; line-height: 1.7; color: #888; margin-top: 14px; padding-top: 12px; padding-right: 52px; border-top: 1px dashed #e5e5e5; word-break: keep-all; }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .hint { font-size: 12px; background: #f1f1ee; color: #555; padding: 5px 9px; border-radius: 6px; font-weight: 500; }
  .card .tap { text-align: center; font-size: 12px; color: #bbb; margin-top: 16px; }
  .speak-btn {
    position: absolute; right: 14px; bottom: 14px;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid #e0e0e0; background: #f7f7f5; font-size: 17px;
  }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button { flex: 1; padding: 16px 0; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; }
  .btn-again { background: #fff; color: #1a1a1a; border: 1.5px solid #d5d5d5 !important; }
  .btn-got { background: #1a1a1a; color: #fff; }
  .btn-got.undo { background: #4caf50; }
  .nav { display: flex; justify-content: space-between; margin-top: 10px; }
  .nav button { background: none; border: none; color: #888; font-size: 13px; padding: 10px 6px; font-weight: 600; }
  .nav button:disabled { opacity: .3; }

  .finish { background: #fff; border: 1px solid #ebebeb; border-radius: 16px; padding: 32px 20px; text-align: center; }
  .finish .emoji { font-size: 40px; }
  .finish h3 { font-size: 18px; margin: 12px 0 6px; }
  .finish p { font-size: 13px; color: #888; line-height: 1.6; }
  .finish .actions { flex-direction: column; margin-top: 20px; }
  .finish .actions button { padding: 14px; }

  /* cloze */
  .cloze-wrap { background: #fff; border: 1px solid #ebebeb; border-radius: 14px; padding: 6px 18px; }
  .sent { padding: 14px 0; border-bottom: 1px solid #f0f0ee; display: flex; gap: 10px; }
  .sent:last-child { border-bottom: none; }
  .sent .n { font-size: 11px; font-weight: 700; color: #ccc; margin-top: 6px; min-width: 16px; }
  .sent .n.ok { color: #4caf50; }
  .sent .body { flex: 1; font-size: 16px; line-height: 2; color: #1a1a1a; }
  .sent .ko-sm { font-size: 12.5px; color: #999; line-height: 1.6; margin-top: 4px; word-break: keep-all; }
  .blank {
    display: inline-block; vertical-align: baseline; min-width: 2.2em; height: 1.55em; line-height: 1.5em;
    background: #eeeeea; border-bottom: 2px solid #c9c9c4; border-radius: 4px; color: #aaa;
    text-align: left; padding: 0 5px; margin: 0 1px; cursor: pointer; font-size: 14px; letter-spacing: 1px;
    user-select: none; -webkit-user-select: none;
  }
  .blank b { color: #666; font-weight: 700; }
  .blank.open { background: #fff5c2; border-bottom-color: #f0c000; color: #1a1a1a; letter-spacing: 0; padding: 0 3px; }
  .sent .mini { background: none; border: 1px solid #e5e5e5; border-radius: 6px; font-size: 12px; padding: 4px 8px; color: #666; margin-top: 8px; margin-right: 6px; }
  .toolbar { display: flex; gap: 8px; margin-top: 12px; }
  .toolbar button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 600; color: #333; }

  /* full */
  .full-wrap { background: #fff; border: 1px solid #ebebeb; border-radius: 14px; padding: 6px 18px; }
  .full-wrap .en-line { font-size: 16px; line-height: 1.8; color: #1a1a1a; }
  .full-wrap .en-line mark { background: #fff5c2; padding: 0 2px; border-radius: 3px; }
  .full-wrap .ko-sm.hidden { display: none; }

  .edit-card { background: #fff; border: 1px solid #ebebeb; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .edit-card label { display: block; font-size: 11px; font-weight: 700; color: #999; margin: 8px 0 4px; }
  .edit-card textarea, .edit-card input {
    width: 100%; font-family: inherit; font-size: 14px; line-height: 1.6; border: 1px solid #ddd; border-radius: 8px; padding: 9px 10px; resize: vertical;
  }
  .edit-card textarea { min-height: 72px; }
  .edit-card .del { background: none; border: none; color: #d33; font-size: 12px; font-weight: 600; margin-top: 8px; padding: 6px 0; }
  .edit-tip { font-size: 12px; color: #888; line-height: 1.6; margin-bottom: 12px; background: #f1f1ee; padding: 10px 12px; border-radius: 8px; }

  .danger { width: 100%; margin-top: 24px; background: none; border: none; color: #bbb; font-size: 12px; padding: 10px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 20px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div id="hdr-left"><div class="logo">OPIc 스크립트 암기</div></div>
  <a class="hdr-link" href="index.html">Daily 연습 →</a>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DATA  — 1인칭 스크립트. 전체보기 탭의 ✏️ 수정으로 내 이야기로 바꿀 수 있음.
   keys: 빈칸 게임 1단계에서 가려지는 핵심 표현 (en 안에 정확히 포함되어야 함)
   ========================================================= */
const CATEGORIES = [
{ name: "기본 정보", topics: [
  { id: "intro", title: "자기소개", en: "Self-Introduction", cards: [
    { en: "Hi, let me introduce myself. I'm a software developer, and I've been working at a mid-sized IT company in Seoul for about five years now.",
      ko: "안녕하세요, 제 소개를 할게요. 저는 소프트웨어 개발자이고, 서울에 있는 중견 IT 회사에서 5년 정도 일하고 있어요.",
      keys: ["let me introduce myself", "mid-sized IT company", "for about five years"] },
    { en: "I'm in charge of building the front-end of our web service, which basically means I work on everything users see and click on.",
      ko: "저는 웹 서비스의 프론트엔드 개발을 담당하고 있는데, 쉽게 말해 사용자가 보고 클릭하는 모든 걸 만드는 일이에요.",
      keys: ["in charge of", "which basically means"] },
    { en: "Outside of work, I'm really into running. I go for a run along the Han River three or four times a week, and it's the best way for me to clear my head.",
      ko: "일 외에는 달리기에 푹 빠져 있어요. 일주일에 서너 번 한강을 따라 달리는데, 머리를 비우는 데 최고예요.",
      keys: ["really into", "three or four times a week", "clear my head"] },
    { en: "Personality-wise, I'd say I'm pretty easygoing and outgoing. My friends often tell me I'm the one who's always up for trying something new.",
      ko: "성격은 꽤 느긋하고 외향적인 편이에요. 친구들은 제가 항상 새로운 걸 시도하려는 사람이라고 자주 말해요.",
      keys: ["Personality-wise", "easygoing", "always up for"] },
    { en: "As for my goals, I'm working toward becoming comfortable enough in English to communicate naturally with overseas clients. That's actually why I'm taking this test.",
      ko: "목표를 말하자면, 해외 고객과 자연스럽게 소통할 수 있을 만큼 영어를 편하게 하는 게 목표예요. 사실 그래서 이 시험을 보고 있어요.",
      keys: ["As for my goals", "working toward", "That's actually why"] },
  ]},
  { id: "home", title: "집 묘사", en: "My Home", cards: [
    { en: "I live in a two-bedroom apartment in Mapo-gu, Seoul. I've been renting it for about two years, and honestly, I couldn't be happier with it.",
      ko: "저는 서울 마포구에 있는 방 두 개짜리 아파트에 살아요. 2년 정도 세 들어 살고 있는데, 솔직히 정말 만족해요.",
      keys: ["two-bedroom apartment", "I've been renting", "couldn't be happier"] },
    { en: "It's on the 12th floor, so on a clear day I get a beautiful view of the Han River from my living room window.",
      ko: "12층이라서 맑은 날에는 거실 창문으로 한강이 아름답게 보여요.",
      keys: ["on the 12th floor", "on a clear day", "a beautiful view of"] },
    { en: "My favorite spot is definitely the living room. It has a big comfy sofa, plenty of natural light, and a bookshelf along one wall where I keep all my favorite books.",
      ko: "제일 좋아하는 공간은 단연 거실이에요. 크고 편한 소파, 충분한 자연광, 그리고 한쪽 벽에 제가 좋아하는 책들을 꽂아둔 책장이 있어요.",
      keys: ["My favorite spot is definitely", "plenty of natural light", "along one wall"] },
    { en: "The kitchen is a bit outdated, so if I could change one thing, I'd renovate it with a bigger counter and better lighting.",
      ko: "주방이 좀 오래돼서, 하나만 바꿀 수 있다면 더 큰 조리대와 더 좋은 조명으로 리모델링하고 싶어요.",
      keys: ["a bit outdated", "if I could change one thing", "renovate"] },
    { en: "What I love most is the location. The subway station is right around the corner, and there are tons of cafes and restaurants within walking distance.",
      ko: "제일 좋은 건 위치예요. 지하철역이 바로 근처에 있고, 걸어갈 수 있는 거리에 카페와 식당이 정말 많아요.",
      keys: ["What I love most is", "right around the corner", "within walking distance"] },
    { en: "Compared to my childhood home, which was a house in the suburbs with a small yard, my place now is much smaller but way more convenient.",
      ko: "마당이 있는 교외 주택이었던 어릴 적 집과 비교하면, 지금 집은 훨씬 작지만 훨씬 더 편리해요.",
      keys: ["Compared to", "in the suburbs", "way more convenient"] },
  ]},
  { id: "neighborhood", title: "동네 / 이웃", en: "Neighborhood", cards: [
    { en: "My neighborhood is a lively area near Hongdae, which is famous for its street performances, indie music scene, and countless cafes.",
      ko: "우리 동네는 홍대 근처의 활기찬 지역인데, 거리 공연, 인디 음악, 수많은 카페로 유명해요.",
      keys: ["a lively area", "is famous for", "countless"] },
    { en: "It's a great mix of young people and long-time residents, so during the day it's calm, but at night it really comes alive.",
      ko: "젊은 사람들과 오래 산 주민들이 잘 섞여 있어서, 낮에는 조용하지만 밤에는 정말 활기가 넘쳐요.",
      keys: ["a great mix of", "long-time residents", "comes alive"] },
    { en: "One thing I really appreciate is that everything is within reach. There's a big supermarket, a gym, and a park all within a ten-minute walk.",
      ko: "정말 고마운 점은 모든 게 가까이 있다는 거예요. 큰 마트, 헬스장, 공원이 모두 걸어서 10분 거리에 있어요.",
      keys: ["really appreciate", "within reach", "a ten-minute walk"] },
    { en: "I've gotten to know the owner of a small coffee shop downstairs. We chat almost every morning, and it makes the neighborhood feel like home.",
      ko: "아래층 작은 커피숍 사장님과 친해졌어요. 거의 매일 아침 이야기를 나누는데, 그래서 동네가 집처럼 느껴져요.",
      keys: ["gotten to know", "almost every morning", "feel like home"] },
    { en: "The only downside is the noise on weekends, but it's a small price to pay for living somewhere this convenient.",
      ko: "유일한 단점은 주말의 소음이지만, 이렇게 편리한 곳에 사는 대가치고는 사소한 편이에요.",
      keys: ["The only downside is", "a small price to pay"] },
  ]},
  { id: "work", title: "직장 / 업무", en: "Work & Career", cards: [
    { en: "I work as a front-end developer at a mid-sized IT company. Our team has about ten people, and we mostly build web services for online shopping.",
      ko: "저는 중견 IT 회사에서 프론트엔드 개발자로 일해요. 팀은 10명 정도이고, 주로 온라인 쇼핑용 웹 서비스를 만들어요.",
      keys: ["front-end developer", "about ten people", "mostly build"] },
    { en: "A typical day starts with a short stand-up meeting at 9:30, where we share what we did yesterday and what we're planning to do today.",
      ko: "보통 하루는 9시 반 짧은 스탠드업 미팅으로 시작하는데, 어제 한 일과 오늘 할 일을 공유해요.",
      keys: ["A typical day starts with", "stand-up meeting", "planning to do"] },
    { en: "The part I enjoy most is seeing something I built actually being used by real people. That gives me a real sense of accomplishment.",
      ko: "제일 즐거운 부분은 제가 만든 것이 실제 사람들에게 쓰이는 걸 보는 거예요. 그럴 때 진짜 성취감을 느껴요.",
      keys: ["The part I enjoy most is", "real people", "a real sense of accomplishment"] },
    { en: "The most challenging project I've handled was a complete redesign of our main dashboard. We had a very tight deadline, and the whole team was under a lot of pressure.",
      ko: "제가 맡았던 가장 어려운 프로젝트는 메인 대시보드 전면 개편이었어요. 마감이 정말 촉박했고, 팀 전체가 큰 압박을 받았죠.",
      keys: ["The most challenging project", "complete redesign", "a very tight deadline", "under a lot of pressure"] },
    { en: "I suggested rolling it out in phases instead of all at once, and thanks to that, we met the deadline without sacrificing quality.",
      ko: "한 번에 다 내놓는 대신 단계별로 출시하자고 제안했고, 덕분에 품질을 희생하지 않고 마감을 맞출 수 있었어요.",
      keys: ["rolling it out in phases", "thanks to that", "without sacrificing quality"] },
    { en: "In terms of work-life balance, my company is pretty flexible. I can work from home twice a week, which makes a huge difference.",
      ko: "워라밸 측면에서 우리 회사는 꽤 유연해요. 주 2회 재택근무가 가능한데, 그게 정말 큰 차이를 만들어요.",
      keys: ["In terms of work-life balance", "work from home", "makes a huge difference"] },
  ]},
  { id: "routine", title: "일상 루틴", en: "Daily Routine", cards: [
    { en: "On weekdays, I usually get up around seven, make a quick cup of coffee, and check my phone for any urgent messages before heading out.",
      ko: "평일에는 보통 7시쯤 일어나서 커피를 빠르게 한 잔 내리고, 나가기 전에 급한 메시지가 있는지 폰을 확인해요.",
      keys: ["get up around seven", "urgent messages", "heading out"] },
    { en: "My commute takes about forty minutes by subway, and I use that time to listen to podcasts or catch up on the news.",
      ko: "출근은 지하철로 40분 정도 걸리는데, 그 시간엔 팟캐스트를 듣거나 뉴스를 따라잡아요.",

/* ============================ STATE ============================ */
const LS_DONE = 'opic_fc_done', LS_CUSTOM = 'opic_fc_custom', LS_PREF = 'opic_fc_pref';
function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let done   = load(LS_DONE, {});
let custom = load(LS_CUSTOM, {});
let pref   = Object.assign({ mode: 'card', onlyNew: false, shuffle: false, level: 1, hideKo: false, showHints: true }, load(LS_PREF, {}));
function savePref() { save(LS_PREF, pref); }

const ALL_TOPICS = CATEGORIES.flatMap(c => c.topics);
const topicById  = id => ALL_TOPICS.find(t => t.id === id);
const getCards   = t  => custom[t.id] || t.cards;
const isDone     = (tid, i) => !!done[tid + ':' + i];
function setDone(tid, i, v) { if (v) done[tid + ':' + i] = 1; else delete done[tid + ':' + i]; save(LS_DONE, done); }
function progress(t) { const c = getCards(t); let n = 0; c.forEach((_, i) => { if (isDone(t.id, i)) n++; }); return { n, total: c.length }; }
function unlearnedAll() { const out = []; ALL_TOPICS.forEach(t => getCards(t).forEach((_, i) => { if (!isDone(t.id, i)) out.push({ tid: t.id, i }); })); return out; }

let view = { screen: 'home', tid: null };   // screen: home | topic | review
let deck = { order: [], pos: 0, flipped: false };  // order: [{tid, i}]
let revealed = {};    // cloze: "ci:ti" -> true
let editing = false;

const $app = document.getElementById('app');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ============================ TTS ============================ */
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('이 브라우저는 음성 재생을 지원하지 않아요'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.92;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.lang === 'en-US' && /Google|Samantha|Karen|Natural|Aria|Jenny/i.test(v.name)) || voices.find(v => v.lang && v.lang.startsWith('en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600); }

/* ============================ NAV ============================ */
function goHome(push) {
  view = { screen: 'home', tid: null }; editing = false;
  if (push !== false) history.replaceState({ screen: 'home' }, '');
  render(); window.scrollTo(0, 0);
}
function goTopic(tid) {
  view = { screen: 'topic', tid }; editing = false; revealed = {};
  history.pushState({ screen: 'topic', tid }, '');
  buildDeck(); render(); window.scrollTo(0, 0);
}
function goReview() {
  const pool = unlearnedAll();
  if (!pool.length) { toast('미암기 카드가 없어요. 모두 외웠어요!'); return; }
  view = { screen: 'review', tid: null }; editing = false;
  history.pushState({ screen: 'review' }, '');
  shuffle(pool); deck = { order: pool.slice(0, 20), pos: 0, flipped: false };
  render(); window.scrollTo(0, 0);
}
function back() { if (history.state && history.state.screen !== 'home') history.back(); else goHome(); }
window.addEventListener('popstate', e => {
  const s = e.state;
  if (!s || s.screen === 'home') goHome(false);
  else if (s.screen === 'topic') { view = { screen: 'topic', tid: s.tid }; buildDeck(); render(); }
  else if (s.screen === 'review') goHome(false);
});
history.replaceState({ screen: 'home' }, '');

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildDeck() {
  const t = topicById(view.tid); const cards = getCards(t);
  let idx = cards.map((_, i) => ({ tid: t.id, i }));
  if (pref.onlyNew) idx = idx.filter(e => !isDone(e.tid, e.i));
  if (pref.shuffle) shuffle(idx);
  deck = { order: idx, pos: 0, flipped: false };
}

/* ============================ RENDER ============================ */
function render() {
  const hdr = document.getElementById('hdr-left');
  if (view.screen === 'home') {
    hdr.innerHTML = '<div class="logo">OPIc 스크립트 암기</div>';
    renderHome();
  } else {
    hdr.innerHTML = '<button class="hdr-btn" onclick="back()">‹ 목록</button>';
    if (view.screen === 'review') renderReview(); else renderTopic();
  }
}

function renderHome() {
  let total = 0, learned = 0;
  ALL_TOPICS.forEach(t => { const p = progress(t); total += p.total; learned += p.n; });
  const pct = total ? Math.round(learned / total * 100) : 0;
  const pool = total - learned;
  let n = 0;
  const cats = CATEGORIES.map(c => `
    <div class="cat-title">${c.name}</div>
    ${c.topics.map(t => { const p = progress(t); n++; const full = p.n === p.total;
      return `<button class="topic-row ${full ? 'complete' : ''}" onclick="goTopic('${t.id}')">
        <div class="num">${String(n).padStart(2, '0')}</div>
        <div class="t"><div class="t-ko">${esc(t.title)}</div><div class="t-en">${esc(t.en)}</div>
          <div class="t-bar"><div style="width:${p.total ? p.n / p.total * 100 : 0}%"></div></div></div>
        <div class="cnt">${full ? '✓ 완료' : p.n + ' / ' + p.total}</div>
      </button>`; }).join('')}`).join('');
  $app.innerHTML = `
    <div class="summary">
      <div class="big">${learned} <span style="font-size:15px;color:#999;font-weight:500">/ ${total} 문장 암기</span></div>
      <div class="sub">${ALL_TOPICS.length}개 주제 · ${pct}% 완료 · 진행 상황은 이 기기에 저장돼요</div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <button class="review-btn" onclick="goReview()" ${pool ? '' : 'disabled'}>🎲 미암기 카드 랜덤 복습 (${Math.min(pool, 20)}장)</button>
    </div>
    ${cats}
    <button class="danger" onclick="resetAll()">전체 진행 상황 초기화</button>`;
}

function renderTopic() {
  const t = topicById(view.tid); const p = progress(t);
  const tab = m => `<button class="${pref.mode === m ? 'on' : ''}" onclick="setMode('${m}')">${{ card: '🃏 카드', cloze: '🙈 빈칸', full: '📖 전체' }[m]}</button>`;
  let body = pref.mode === 'card' ? renderCardMode() : pref.mode === 'cloze' ? renderCloze(t) : renderFull(t);
  $app.innerHTML = `
    <div class="topic-head"><div class="title">${esc(t.title)}</div><div class="en">${esc(t.en)} · ${p.n}/${p.total} 외움</div></div>
    <div class="tabs">${tab('card')}${tab('cloze')}${tab('full')}</div>
    ${body}
    <button class="danger" onclick="resetTopic('${t.id}')">이 주제 진행 상황 초기화</button>`;
}

function renderReview() {
  $app.innerHTML = `
    <div class="topic-head"><div class="title">랜덤 복습</div><div class="en">아직 못 외운 카드만 섞어서 · 최대 20장</div></div>
    ${renderCardMode(true)}`;
}

/* ---------- card mode ---------- */
function renderCardMode(isReview) {
  const opts = isReview ? '' : `
    <div class="opts">
      <button class="chip ${pref.onlyNew ? 'on' : ''}" onclick="togglePref('onlyNew')">미암기만</button>
      <button class="chip ${pref.shuffle ? 'on' : ''}" onclick="togglePref('shuffle')">셔플</button>
      <button class="chip ${pref.showHints ? 'on' : ''}" onclick="togglePref('showHints', true)">힌트</button>
      <div class="spacer"></div>
      <div class="counter">${deck.order.length ? (deck.pos + 1) + ' / ' + deck.order.length : '0 / 0'}</div>
    </div>`;

  if (!deck.order.length) {
    return opts + `<div class="finish"><div class="emoji">🎉</div><h3>이 주제는 전부 외웠어요</h3><p>미암기만 필터를 끄면 전체 카드를 다시 볼 수 있어요.</p>
      <div class="actions"><button class="btn-got" onclick="togglePref('onlyNew')">전체 카드 보기</button></div></div>`;
  }
  if (deck.pos >= deck.order.length) {
    const got = deck.order.filter(e => isDone(e.tid, e.i)).length;
    return opts + `<div class="finish"><div class="emoji">${got === deck.order.length ? '🏆' : '💪'}</div>
      <h3>한 바퀴 완료</h3><p>${deck.order.length}장 중 ${got}장 외웠어요.${got < deck.order.length ? '<br>못 외운 카드만 다시 돌려볼까요?' : ''}</p>
      <div class="actions">
        ${got < deck.order.length ? `<button class="btn-got" onclick="repeatMissed()">못 외운 ${deck.order.length - got}장만 반복</button>` : ''}
        <button class="btn-again" onclick="restartDeck()">처음부터 다시</button>
        ${isReview ? `<button class="btn-again" onclick="back()">목록으로</button>` : ''}
      </div></div>`;
  }

  const e = deck.order[deck.pos]; const t = topicById(e.tid); const c = getCards(t)[e.i];
  const dn = isDone(e.tid, e.i);
  const label = isReview ? `${esc(t.title)} · ${e.i + 1}` : `문장 ${e.i + 1}`;
  const face = !deck.flipped
    ? `<div class="side-label"><span>한국어 · ${label}</span>${dn ? '<span class="done-mark">✓ 외움</span>' : ''}</div>
       <div class="ko">${esc(c.ko)}</div>
       ${pref.showHints && c.keys.length ? `<div class="hints">${c.keys.map(k => `<span class="hint">${esc(k)}</span>`).join('')}</div>` : ''}
       <div class="tap">탭해서 영어 보기</div>`
    : `<div class="side-label"><span>English · ${label}</span>${dn ? '<span class="done-mark">✓ 외움</span>' : ''}</div>
       <div class="en">${esc(c.en)}</div>
       <div class="en-sub">${esc(c.ko)}</div>
       <button class="speak-btn" onclick="event.stopPropagation();speak(${JSON.stringify(c.en).replace(/"/g, '&quot;')})">🔊</button>`;

  return opts + `
    <div class="card" onclick="flip()">${face}</div>
    <div class="actions">
      <button class="btn-again" onclick="mark(false)">↺ 다시</button>
      <button class="btn-got ${dn ? 'undo' : ''}" onclick="mark(true)">${dn ? '✓ 외움 유지' : '✓ 외웠어요'}</button>
    </div>
    <div class="nav">
      <button onclick="move(-1)" ${deck.pos === 0 ? 'disabled' : ''}>‹ 이전</button>
      <button onclick="flip()">${deck.flipped ? '한국어 보기' : '영어 보기'}</button>
      <button onclick="move(1)">건너뛰기 ›</button>
    </div>`;
}
function flip() { deck.flipped = !deck.flipped; render(); }
function move(d) { deck.pos = Math.max(0, deck.pos + d); deck.flipped = false; render(); }
function mark(v) {
  const e = deck.order[deck.pos]; setDone(e.tid, e.i, v);
  deck.pos++; deck.flipped = false; render();
  if (deck.pos < deck.order.length) window.scrollTo(0, 0);
}
function repeatMissed() { deck.order = deck.order.filter(e => !isDone(e.tid, e.i)); shuffle(deck.order); deck.pos = 0; deck.flipped = false; render(); }
function restartDeck() { if (view.screen === 'topic') buildDeck(); else { shuffle(deck.order); deck.pos = 0; deck.flipped = false; } render(); }
function togglePref(k, keepPos) { pref[k] = !pref[k]; savePref(); if (!keepPos && view.screen === 'topic') buildDeck(); render(); }
function setMode(m) { pref.mode = m; savePref(); editing = false; revealed = {}; render(); }

/* ---------- cloze mode ---------- */
function tokenize(en) {
  const out = []; const re = /[A-Za-z0-9'’-]+|[^A-Za-z0-9'’-]+/g; let m;
  while ((m = re.exec(en))) out.push({ text: m[0], start: m.index, word: /[A-Za-z0-9]/.test(m[0]) });
  return out;
}
function hiddenSet(c, level) {
  const toks = tokenize(c.en); const lower = c.en.toLowerCase(); const hide = new Set();
  const inKey = new Set();
  (c.keys || []).forEach(k => {
    const kl = k.toLowerCase(); let from = 0, at;
    while ((at = lower.indexOf(kl, from)) !== -1) {
      toks.forEach((tk, i) => { if (tk.word && tk.start < at + kl.length && tk.start + tk.text.length > at) inKey.add(i); });
      from = at + kl.length;
    }
  });
  let w = 0;
  toks.forEach((tk, i) => {
    if (!tk.word) return;
    if (level >= 3) hide.add(i);
    else if (inKey.has(i)) hide.add(i);
    else if (level === 2 && tk.text.length >= 3 && (w % 2 === 0)) hide.add(i);
    w++;
  });
  return { toks, hide };
}
function renderCloze(t) {
  const cards = getCards(t);
  const lv = l => `<button class="chip ${pref.level === l ? 'on' : ''}" onclick="setLevel(${l})">${['', '1 키워드', '2 절반', '3 전체'][l]}</button>`;
  const sents = cards.map((c, ci) => {
    const { toks, hide } = hiddenSet(c, pref.level);
    const html = toks.map((tk, ti) => {
      if (!hide.has(ti)) return esc(tk.text);
      const open = revealed[ci + ':' + ti];
      const w = Math.max(2.2, tk.text.length * 0.62);
      return `<span class="blank ${open ? 'open' : ''}" style="min-width:${w}em" onclick="reveal(${ci},${ti})">${open ? esc(tk.text) : '<b>' + esc(tk.text[0]) + '</b>'}</span>`;
    }).join('');
    return `<div class="sent"><div class="n ${isDone(t.id, ci) ? 'ok' : ''}">${isDone(t.id, ci) ? '✓' : ci + 1}</div>
      <div><div class="body">${html}</div>
        ${pref.hideKo ? '' : `<div class="ko-sm">${esc(c.ko)}</div>`}
        <button class="mini" onclick="speak(${JSON.stringify(c.en).replace(/"/g, '&quot;')})">🔊 듣기</button>
        <button class="mini" onclick="revealSentence(${ci})">문장 보기</button>
        <button class="mini" onclick="toggleDoneAt('${t.id}',${ci})">${isDone(t.id, ci) ? '외움 취소' : '✓ 외웠어요'}</button>
      </div></div>`;
  }).join('');
  return `
    <div class="opts">${lv(1)}${lv(2)}${lv(3)}<div class="spacer"></div>
      <button class="chip ${pref.hideKo ? 'on' : ''}" onclick="togglePref('hideKo', true)">한글 숨김</button></div>
    <div class="cloze-wrap">${sents}</div>
    <div class="toolbar">
      <button onclick="revealAll(true)">모두 보기</button>
      <button onclick="revealAll(false)">다시 가리기</button>
      <button onclick="speakAll('${t.id}')">🔊 전체 듣기</button>
    </div>`;
}
function setLevel(l) { pref.level = l; savePref(); revealed = {}; render(); }
function reveal(ci, ti) { revealed[ci + ':' + ti] = !revealed[ci + ':' + ti]; render(); }
function revealSentence(ci) { const t = topicById(view.tid); const c = getCards(t)[ci]; const { hide } = hiddenSet(c, pref.level); hide.forEach(ti => revealed[ci + ':' + ti] = true); render(); }
function revealAll(v) { revealed = {}; if (v) { const t = topicById(view.tid); getCards(t).forEach((c, ci) => { const { hide } = hiddenSet(c, pref.level); hide.forEach(ti => revealed[ci + ':' + ti] = true); }); } render(); }
function toggleDoneAt(tid, i) { setDone(tid, i, !isDone(tid, i)); render(); }
function speakAll(tid) { speak(getCards(topicById(tid)).map(c => c.en).join(' ')); }

/* ---------- full mode + edit ---------- */
function highlight(en, keys) {
  let html = esc(en);
  (keys || []).slice().sort((a, b) => b.length - a.length).forEach(k => {
    const re = new RegExp(esc(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    html = html.replace(re, m => `${m}`);
  });
  return html.replace(//g, '<mark>').replace(//g, '</mark>');
}
function renderFull(t) {
  const cards = getCards(t);
  if (editing) return renderEdit(t, cards);
  const sents = cards.map((c, ci) => `
    <div class="sent"><div class="n ${isDone(t.id, ci) ? 'ok' : ''}">${isDone(t.id, ci) ? '✓' : ci + 1}</div>
      <div><div class="en-line">${highlight(c.en, c.keys)}</div>
        <div class="ko-sm ${pref.hideKo ? 'hidden' : ''}">${esc(c.ko)}</div>
        <button class="mini" onclick="speak(${JSON.stringify(c.en).replace(/"/g, '&quot;')})">🔊 듣기</button>
        <button class="mini" onclick="toggleDoneAt('${t.id}',${ci})">${isDone(t.id, ci) ? '외움 취소' : '✓ 외웠어요'}</button>
      </div></div>`).join('');
  return `
    <div class="opts">
      <button class="chip ${pref.hideKo ? 'on' : ''}" onclick="togglePref('hideKo', true)">한글 숨김</button>
      <div class="spacer"></div>
      ${custom[t.id] ? '<span class="counter">✏️ 내가 수정한 버전</span>' : ''}
      <button class="chip" onclick="startEdit()">✏️ 내 이야기로 수정</button>
    </div>
    <div class="full-wrap">${sents}</div>
    <div class="toolbar"><button onclick="speakAll('${t.id}')">🔊 전체 듣기</button><button onclick="copyScript('${t.id}')">📋 복사</button></div>`;
}
function renderEdit(t, cards) {
  const rows = cards.map((c, i) => `
    <div class="edit-card">
      <label>영어 문장 ${i + 1}</label><textarea data-f="en">${esc(c.en)}</textarea>
      <label>한국어 뜻</label><textarea data-f="ko">${esc(c.ko)}</textarea>
      <label>빈칸으로 가릴 핵심 표현 (쉼표로 구분, 영어 문장 안에 있는 그대로)</label><input data-f="keys" value="${esc((c.keys || []).join(', '))}">
      <button class="del" onclick="this.parentElement.remove()">이 문장 삭제</button>
    </div>`).join('');
  return `
    <div class="edit-tip">직업, 동네, 취미 등을 <b>내 실제 이야기</b>로 바꿔두면 시험장에서 훨씬 자연스럽게 나와요. 저장하면 이 기기에만 보관되고, 언제든 원본으로 되돌릴 수 있어요.</div>
    <div id="edit-list">${rows}</div>
    <button class="chip" style="width:100%;padding:12px" onclick="addEditRow()">+ 문장 추가</button>
    <div class="toolbar">
      <button style="background:#1a1a1a;color:#fff;border-color:#1a1a1a" onclick="saveEdit('${t.id}')">저장</button>
      <button onclick="editing=false;render()">취소</button>
      ${custom[t.id] ? `<button onclick="revertEdit('${t.id}')">원본으로</button>` : ''}
    </div>`;
}
function startEdit() { editing = true; render(); }
function addEditRow() {
  const d = document.createElement('div'); d.className = 'edit-card';
  d.innerHTML = `<label>영어 문장</label><textarea data-f="en"></textarea><label>한국어 뜻</label><textarea data-f="ko"></textarea>
    <label>빈칸으로 가릴 핵심 표현 (쉼표로 구분)</label><input data-f="keys"><button class="del" onclick="this.parentElement.remove()">이 문장 삭제</button>`;
  document.getElementById('edit-list').appendChild(d); d.querySelector('textarea').focus();
}
function saveEdit(tid) {
  const cards = [];
  document.querySelectorAll('#edit-list .edit-card').forEach(el => {
    const en = el.querySelector('[data-f=en]').value.trim(); if (!en) return;
    const ko = el.querySelector('[data-f=ko]').value.trim();
    const keys = el.querySelector('[data-f=keys]').value.split(',').map(s => s.trim()).filter(s => s && en.toLowerCase().includes(s.toLowerCase()));
    cards.push({ en, ko, keys });
  });
  if (!cards.length) { toast('문장이 최소 하나는 필요해요'); return; }
  custom[tid] = cards; save(LS_CUSTOM, custom);
  Object.keys(done).forEach(k => { if (k.startsWith(tid + ':') && +k.split(':')[1] >= cards.length) delete done[k]; }); save(LS_DONE, done);
  editing = false; buildDeck(); render(); toast('저장했어요');
}
function revertEdit(tid) {
  if (!confirm('내가 수정한 내용을 지우고 원본 스크립트로 되돌릴까요?')) return;
  delete custom[tid]; save(LS_CUSTOM, custom); editing = false; buildDeck(); render(); toast('원본으로 되돌렸어요');
}
function copyScript(tid) {
  const text = getCards(topicById(tid)).map(c => c.en).join('\n\n');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('영어 스크립트를 복사했어요'), () => toast('복사 실패'));
  else toast('이 브라우저는 복사를 지원하지 않아요');
}

/* ---------- reset ---------- */
function resetTopic(tid) {
  if (!confirm('이 주제의 외움 표시를 모두 지울까요?')) return;
  Object.keys(done).forEach(k => { if (k.startsWith(tid + ':')) delete done[k]; }); save(LS_DONE, done); buildDeck(); render(); toast('초기화했어요');
}
function resetAll() {
  if (!confirm('모든 주제의 외움 표시를 지울까요? (수정한 스크립트는 유지돼요)')) return;
  done = {}; save(LS_DONE, done); render(); toast('전체 초기화했어요');
}

render();
</script>
</body>
</html>
